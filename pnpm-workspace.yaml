packages:
  - 'packages/*'

catalog:
  '@nestjs/testing': ^12.4.2
  '@types/node': ^24.19.2
  drizzle-orm: ^0.45.4
  pg: ^8.23.1
  supertest: ^7.3.2
  typescript: ~6.0.3
  vitest: ^5.1.0

# Disable pnpm's default release-age delay.
minimumReleaseAge: 0
trustPolicy: no-downgrade
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
